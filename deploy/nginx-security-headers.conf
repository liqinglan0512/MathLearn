# MathForge security response headers.
#
# Installed by deploy.sh to /etc/nginx/snippets/mathforge-headers.conf and
# included from the server block AND from every location block that sets its
# own add_header.
#
# WHY THE REPETITION IS NECESSARY
# nginx's add_header directives are inherited from an outer block ONLY when the
# inner block sets no add_header of its own. A single add_header inside a
# location silently drops every add_header inherited from the server block.
# MathForge shipped with the headers declared once at server level and
# Cache-Control set per location, so in practice the site served none of them.
# Keeping the set in one snippet and including it everywhere avoids both the
# silent loss and the drift that copy-pasting four directives would cause.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# MathForge makes no third-party network requests: no analytics, no CDN fonts,
# no error reporting. The policy is therefore deliberately tight.
# 'unsafe-inline' is required for style-src only, because KaTeX writes inline
# style attributes on the spans it generates. script-src stays strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
