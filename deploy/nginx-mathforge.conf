# MathForge — nginx site config for a static single-page app.
#
# This is a TEMPLATE. deploy.sh substitutes __MATHFORGE_PORT__ and
# __MATHFORGE_ROOT__ before installing it as
# /etc/nginx/sites-available/mathforge.
#
# IMPORTANT — this host is shared.
# Ports 80 and 443 on this server belong to another application (Leo Tree).
# MathForge therefore listens on its own port and MUST NOT be given a
# catch-all server block on 80, or it will hijack the other site's traffic.
# Do not add `listen 80 default_server` here.
#
# IMPORTANT — add_header inheritance.
# nginx drops every inherited add_header as soon as a location sets one of its
# own. Security headers therefore live in snippets/mathforge-headers.conf and
# are included in the server block AND in every location below that sets any
# add_header. If you add a location with an add_header, include the snippet
# there too, or that path will silently serve no security headers.

server {
    listen __MATHFORGE_PORT__;
    listen [::]:__MATHFORGE_PORT__;

    server_name _;

    root __MATHFORGE_ROOT__;
    index index.html;

    include snippets/mathforge-headers.conf;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # --- Caching -----------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they are immutable.
    # Cache-Control is set once here rather than with `expires`, which would
    # emit a second, competing Cache-Control header.
    location /assets/ {
        include snippets/mathforge-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The Euclid corpus is fetched on demand as plain JSON.
    location /content/ {
        include snippets/mathforge-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep booting an old build
    # that references asset hashes which no longer exist.
    location = /index.html {
        include snippets/mathforge-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- SPA routing -------------------------------------------------------
    # React Router owns /principles, /viz, /problems, /tools and friends.
    # Any unmatched path must fall through to index.html or a hard refresh on
    # a deep link returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
