# MathForge — nginx site config for a static single-page app.
#
# This is a TEMPLATE. deploy.sh substitutes __MATHFORGE_PORT__ and
# __MATHFORGE_ROOT__ before installing it as
# /etc/nginx/sites-available/mathforge.
#
# IMPORTANT — this host is shared.
# Ports 80 and 443 on this server belong to another application (Leo Tree).
# MathForge therefore listens on its own port and MUST NOT be given a
# catch-all server block on 80, or it will hijack the other site's traffic.
# Do not add `listen 80 default_server` here.

server {
    listen __MATHFORGE_PORT__;
    listen [::]:__MATHFORGE_PORT__;

    server_name _;

    root __MATHFORGE_ROOT__;
    index index.html;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MathForge makes no third-party network requests: no analytics, no fonts
    # CDN, no error reporting. The policy below is therefore deliberately
    # tight. 'unsafe-inline' for styles is required by KaTeX, which sets
    # inline style attributes on the spans it generates.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # --- Caching -----------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The Euclid corpus is fetched on demand as plain JSON.
    location /content/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep booting an old build
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- SPA routing -------------------------------------------------------
    # React Router owns /principles, /viz, /problems, /tools and friends.
    # Any unmatched path must fall through to index.html or a hard refresh on
    # a deep link returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
